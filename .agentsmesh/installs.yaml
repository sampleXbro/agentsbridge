# yaml-language-server: $schema=https://unpkg.com/agentsmesh@0.20.0/schemas/installs.json
version: 1
installs:
  - name: addyosmani-agent-skills-pack
    source: github:addyosmani/agent-skills@2a62238edd41ccd9a5a4d16269a4d87808e3e9c1
    version: 2a62238edd41ccd9a5a4d16269a4d87808e3e9c1
    source_kind: github
    features:
      - skills
      - commands
      - agents
  - name: alirezarezvani-claude-skills-skills
    source: github:alirezarezvani/claude-skills@110348f4b2a66d856bc474a1f3f304ab93a50853
    version: 110348f4b2a66d856bc474a1f3f304ab93a50853
    source_kind: github
    features:
      - skills
    pick:
      skills:
        - code-reviewer
    target: claude-code
    as: skills
  - name: composiohq-awesome-claude-skills-skills
    source: github:ComposioHQ/awesome-claude-skills@27904475d1270d8395acf07691966267d5abda2d
    version: 27904475d1270d8395acf07691966267d5abda2d
    source_kind: github
    features:
      - skills
    pick:
      skills:
        - changelog-generator
    target: claude-code
    as: skills
  - name: devsforge-orchestrator-skills
    source: github:devsforge/orchestrator@a4cbcf2503595b83f3fdc66ddb6d1905d7bef51f
    version: a4cbcf2503595b83f3fdc66ddb6d1905d7bef51f
    source_kind: github
    features:
      - skills
    pick:
      skills:
        - quality-gates
    path: skills
    as: skills
  - name: joeking-ly-claude-skills-arsenal-skills
    source: github:joeking-ly/claude-skills-arsenal@0f5b3804660487c5aab1baea0d9981608b959b91
    version: 0f5b3804660487c5aab1baea0d9981608b959b91
    source_kind: github
    features:
      - skills
    pick:
      skills:
        - release-manager
    path: skills
    as: skills
  - name: mattpocock-skills-skills
    source: github:mattpocock/skills@e3b90b5238f38cdea5996e16861dcae28ef52eda
    version: e3b90b5238f38cdea5996e16861dcae28ef52eda
    source_kind: github
    features:
      - skills
    path: skills/productivity
    as: skills
    original_ref: HEAD
  - name: njengah-claude-code-cheat-sheet-agents
    source: github:Njengah/claude-code-cheat-sheet@94fbfc0040b11e16070d895c7282a6028d35e89c
    version: 94fbfc0040b11e16070d895c7282a6028d35e89c
    source_kind: github
    features:
      - agents
    pick:
      agents:
        - code-security-auditor
        - code-standards-enforcer
        - code-debugger
        - code-documenter
        - code-refactor
        - typescript-developer
    target: claude-code
    path: subagents
    as: agents
