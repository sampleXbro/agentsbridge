        - "pack naming"
        - "skill-pack"
        - "manual install"
        - "umbrella skill"
        - "pick.skills"
        - "post-install"
        - "post-uninstall"

  - topic: watch-and-test-timing
    file: .agentsmesh/lessons/topics/watch-and-test-timing.md
    summary: Watch tests, harness import, vi.waitFor budgets, chokidar polling in tests, onCycle synchronization, parallel test isolation.
    triggers:
      file_globs:
        - "tests/harness/watch.ts"
        - "tests/harness/watch.js"
        - "tests/unit/cli/commands/watch.test.ts"
        - "tests/**/watch*.test.ts"
        - "tests/**/*watch*.test.ts"
        - "scripts/flake-check-watch.ts"
        - "src/cli/commands/watch.ts"
        - "vitest.config*"
      command_patterns:
        - "pnpm flake:watch"
        - "pnpm test:coverage"
      keywords:
