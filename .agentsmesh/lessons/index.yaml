        - chokidar
        - debounce
        - polling
        - FSEvents
        - inotify
        - "full suite"
        - "full-suite"
        - harness
        - onCycle
        - flake
        - "idle stability"
        - readiness
        - "parallel test"
        - "test isolation"

  - topic: dist-backed-tests
    file: .agentsmesh/lessons/topics/dist-backed-tests.md
    summary: e2e and integration tests that exec dist/cli.js; require fresh build; avoid parallel rebuilds.
    triggers:
      file_globs:
        - "dist/cli.js"
        - "tests/e2e/**/*.test.ts"
        - "tests/integration/**/*.test.ts"
        - "tests/e2e/helpers/run-cli.ts"
        - "tests/e2e/helpers/**"
        - "tsup.config*"
        - ".github/workflows/ci.yml"
        - ".github/workflows/quality*.yml"
      command_patterns:
        - "^pnpm test:e2e"
        - "^pnpm test:coverage"
        - "node dist/cli.js"
        - "node ./dist/cli.js"
        - "dist/cli\\.js"
      keywords:
        - "dist/cli.js"
        - "pnpm build"
        - "pnpm test:e2e"
        - runCli
        - tsup
        - rebuild
        - "cache key"
        - "stale dist"

  - topic: generation-collision-source-maps
    file: .agentsmesh/lessons/topics/generation-collision-source-maps.md
