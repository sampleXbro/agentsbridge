version: 1
clusters:
  - topic: windows-paths
    file: .agentsmesh/lessons/topics/windows-paths.md
    summary: POSIX vs Windows path handling; separators, realpath divergence, drive letters, CRLF, chokidar polling, basename vs split.
    triggers:
      file_globs:
        - "src/**/path*.ts"
        - "src/**/path-helpers.ts"
        - "src/core/path-helpers.ts"
        - "src/core/reference/**/*.ts"
        - "src/targets/**/import-mappers.ts"
        - "src/targets/**/importer*.ts"
        - "src/utils/filesystem/**"
        - "src/utils/filesystem/windows-path-safety.ts"
        - "tests/**/*windows*"
        - "tests/**/*posix*"
        - "tests/helpers/posix-path.ts"
        - ".gitattributes"
      command_patterns:
        - "^pnpm test:e2e"
        - "windows-latest"
      keywords:
        - windows
        - posix
        - realpath
        - basename
        - "drive letter"
        - separator
        - backslash
        - crlf
        - "core.autocrlf"
        - ".gitattributes"
        - tmpdir
        - chokidar
        - "8.3"
        - usePolling

  - topic: shell-quoting
    file: .agentsmesh/lessons/topics/shell-quoting.md
    summary: Backticks/quotes in rg, node -e, heredocs; shell-rc edits; cross-shell portability; control bytes via Write tool.
    triggers:
      file_globs:
        - "scripts/install.sh"
        - "scripts/**.sh"
      command_patterns:
        - "^rg "
        - " rg "
        - "node -e"
        - "execSync"
        - "spawnSync"
        - "/bin/sh"
        - "/bin/zsh"
        - "<<EOF"
        - "<<'EOF'"
        - "<<-"
      keywords:
        - backtick
        - heredoc
        - "shell-rc"
        - "rc file"
        - "template literal"
        - fish
        - "/bin/sh"
        - "/bin/zsh"
        - "merge marker"
        - "merge-conflict"
        - "block comment"
        - "JSDoc"
        - "\\x"
        - "\\u"
        - "control byte"

  - topic: link-rebaser
    file: .agentsmesh/lessons/topics/link-rebaser.md
    summary: How reference text is rewritten — protected anchors vs markdown destinations, fenced code, project-root-relative, existence gates, pathApi discipline.
    triggers:
      file_globs:
        - "src/core/reference/**/*.ts"
        - "src/core/reference/link-rebaser*.ts"
        - "src/core/reference/link-rebaser-helpers.ts"
        - "src/core/reference/link-rebaser-formatting.ts"
        - "src/core/reference/link-token-classifier*.ts"
        - "src/core/reference/rewriter.ts"
        - "src/core/reference/output-source-map.ts"
        - "src/core/reference/validate-generated-markdown-links.ts"
        - "src/core/reference/pack-skill-artifact-paths.ts"
        - "src/targets/**/applyXxxRefs*.ts"
        - "src/targets/**/reference*.ts"
        - "tests/**/link-rebaser*.test.ts"
        - "tests/**/reference-rewrite*.test.ts"
        - "tests/**/generate-reference-rewrite-matrix*.test.ts"
      command_patterns: []
      keywords:
        - "link rebaser"
        - "link rebasing"
        - "reference rewrite"
        - "reference-rewrite"
        - "pathApi"
        - expandResolvedPaths
        - formatLinkPath
        - "project-root-relative"
        - "root-relative"
        - "protected range"
        - "fenced code"
        - "URI skip"
        - "existence gate"
        - "markdown link"
        - "reference-style"
        - "shouldPreserveAgentsMeshAnchor"

  - topic: install-import-pickers
    file: .agentsmesh/lessons/topics/install-import-pickers.md
    summary: Install pipeline, importers, picker routing, marketplace sub-packs, pack materialization, manifest persistence, sync replay.
    triggers:
      file_globs:
        - "src/install/**/*.ts"
        - "src/install/picker/**"
        - "src/install/pack/**"
        - "src/install/run/**"
        - "src/install/source/**"
        - "src/install/core/install-manifest.ts"
        - "src/targets/**/importer*.ts"
        - "src/targets/**/importer-skills.ts"
        - "src/targets/**/skill-importer.ts"
        - "tests/**/install*.test.ts"
        - "tests/integration/install-*.test.ts"
        - "tests/e2e/install-*.test.ts"
        - ".agentsmesh/installs.yaml"
      command_patterns:
        - "agentsmesh install"
        - "install --sync"
        - "install --all"
        - "install --force"
        - "install --as"
        - "install github:"
        - "install https?://"
        - "cli\\.js install\\b"
      keywords:
        - marketplace
        - "sub-pack"
        - subPack
        - subpack
        - "--as"
        - "--sync"
        - "--force"
        - manifest
        - "installs.yaml"
        - "installAsPack"
        - runInstall
