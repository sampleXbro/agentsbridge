name: Flake check

# Runs the watch-test flake detector on a schedule (not per-push) so timing
# regressions in the watch e2e/integration suites surface before they reach a
# release, without slowing down every CI run. Also dispatchable on demand.
on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  flake:
    name: Watch flake check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # flake:watch re-runs the e2e watch suites that exec dist/cli.js.
      - name: Build
        run: pnpm build

      - name: Flake check (unit + contract, 20×)
        run: pnpm flake:check

      - name: Flake check (watch unit + e2e, 10×)
        run: pnpm flake:watch
